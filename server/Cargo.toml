[package]
name = "elementsplus-dex-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
resolver = "3"
license = "MIT"
description = "Order book / registry server for the Elements+ (ECX Alpha) explicit-output DEX"
publish = false

[dependencies]
axum = "=0.8.9"
elements = "=0.25.3"
elementsplus-instant = { git = "https://github.com/seriouscatsoserious/elementsplus-wallet-extension", rev = "95a34bb135523a4f53d66e83e3a9b2f9e30bb415", package = "elementsplus-instant" }
hex = "=0.4.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
tower-http = { version = "=0.6.11", features = ["cors", "trace", "limit"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tempfile = "=3.27.0"
